
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/alerta.css">
    <title>IrrigaSense</title>
</head>

<body>
    <nav class="navbar">
        <a href="Dashboard.html" class="logo" aria-label="IrrigaSense - início">
            <img src="img/rem-removebg-preview.png" alt="IrrigaSense">
        </a>

        <a href="Dashboard.html" class="item">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>

        <a href="configuraçao.html" class="item">
            <i class="fa-solid fa-gear"></i>
            <span>Configuração</span>
        </a>

        <a href="alerta.html" class="item">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Alerta</span>
        </a>
    </nav>

    <main class="container">
        <section class="lista-alertas" aria-label="Alertas ativos">
            <article class="cartao-alerta" role="alert">
                <div class="cabecalho-alerta">
                    <span class="icone-alerta" aria-hidden="true">!</span>
                    <button class="fechar-alerta" type="button" aria-label="Fechar alerta">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="mensagem-alerta">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                    <div>
                        <h1>Vazão abaixo do esperado</h1>
                        <p>A vazão média está abaixo do valor esperado.</p>
                    </div>
                </div>
            </article>

            <p class="sem-alertas" hidden>Nenhum alerta ativo.</p>
        </section>
    </main>

    <script src="js/alerta.js" defer></script>
</body>
</html>
